version: '3.8'

services:
  nginx:
    build: ./nginx
    container_name: ngnix-proxy
    ports:
      - "8080:8080"
    depends_on:
       service_1:
          condition: service_healthy
       service_2:
          condition: service_healthy

  service_1:
    build: ./service_1
    container_name: service1
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001"]
      interval: 30s
      timeout: 10s
      retries: 5

  service_2:
    build: ./service_2
    container_name: service2
    ports:
      - "8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002"]
      interval: 30s
      timeout: 10s
      retries: 5